  "@lexical/rich-text": 0.52.0
  "@lexical/selection": 0.52.0
  rolldown: 1.2.12
  "tw-animate-css": 1.4.0
  "@storybook/addon-a11y": 10.6.1
  "@storybook/addon-docs": 10.6.1
  "@storybook/addon-react-native-server": 1.0.1
  "@storybook/addon-ondevice-actions": 10.6.0
  "@storybook/addon-ondevice-controls": 10.6.0
  "@storybook/addon-vitest": 10.6.1
  "@storybook/react-native": 10.6.0
  "@storybook/react-native-web-vite": 10.6.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-form": 1.33.5
  ajv: 8.20.0
  ajv-formats: 3.0.1
  "@tanstack/react-query": 5.104.1
  "@trpc/client": 11.19.0
  "@trpc/server": 11.19.0
  "@trpc/tanstack-react-query": 11.19.0
  "@types/multicast-dns": 7.2.4
