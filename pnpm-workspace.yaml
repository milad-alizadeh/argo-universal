  "@types/ws": 8.18.2
  "@vitest/browser-playwright": 5.0.3
  "@vitest/coverage-v8": 5.0.3
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  # Exact pins: a caret range on 1.0.0-rc.4 pulls commit builds such as 1.0.0-rc.5-5935859.
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  electron: 44.5.1
  # Expo SDK 58 ranges as create-expo-app writes them, so `expo install --check` agrees.
  expo: ~58.0.17
  expo-build-properties: ~58.0.11
  expo-constants: ~58.0.13
  expo-dev-client: ~58.0.14
  expo-font: ~58.0.9
  expo-glass-effect: ~58.0.4
  expo-linking: ~58.0.14
  expo-router: ~58.0.25
  expo-screen-orientation: ~58.0.3
  expo-splash-screen: ~58.0.11
  expo-status-bar: ~58.0.4
  expo-symbols: ~58.0.4
  expo-asset: ~58.0.18
  expo-audio: ~58.0.10
  expo-video: ~58.0.12
  expo-system-ui: ~58.0.6
  jscpd: 5.4.0
  jsonc-parser: 3.3.1
  json-schema-to-typescript: 16.0.0
  knip: 6.39.0
  playwright: 1.63.0
  playwright-bdd: 9.2.1
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-gesture-handler: ~3.3.0
  react-native-keyboard-controller: 1.22.7
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.0
  react-native-svg: 15.16.0
  # Encodes a Pairing Ticket's invite as QR modules, which the pair sheet draws with react-native-svg. Pure JavaScript, so one encoder serves web, iOS and Android.
  qrcode-generator: 2.0.4
  # Imports a logo SVG as a react-native-svg component in Metro (ADR-0019).
  react-native-svg-transformer: 1.5.3
  # ~0.21.4 excludes 0.21.3: Uniwind 1.12.1 crashes on web start with it (uni-stack/uniwind#704).
  react-native-web: ~0.21.4
  react-native-worklets: 0.13.0
  # Finds the Server on the local network by name, over Bonjour on iOS and NSD on Android (ADR-0045).
  react-native-zeroconf: 0.17.7
  sf-symbols-typescript: 2.2.0
  sherif: 1.13.0
  storybook: 10.6.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.7
  typescript: 7.0.2
  uniwind: 1.13.0
  vite: 8.3.2
  # The same SVG import in Storybook's Vite build, with SVGR's native output.
  vite-plugin-svgr: 5.2.0
  vitest: 5.0.3
  # mDNS for the Server (ADR-0045): multicast-dns answers for it, one responder per network interface; bonjour-service is the browser tests and a desktop App use. Pure JS.
  bonjour-service: 1.4.4
  multicast-dns: 7.2.5
  ws: 8.22.0
  # Exact pin: XState may change types in minor releases.
  xstate: 5.33.2
  zod: 4.6.5
  diff: 9.0.0
  fflate: 0.8.3
  tar: 7.5.22
  # Android header icons as vector drawables, the source the Stack Toolbar guide recommends.
  "@expo/material-symbols": 0.1.1
  semver: 7.8.5
  "@types/semver": 7.7.1
  esbuild: 0.28.2
  "@types/react-reconciler": 0.33.0
  react-reconciler: 0.33.0
  "@shopify/react-native-skia": 2.14.0
  # Last line on Skia 2.x; 43 moves to react-native-skia v3 (ADR-0028).
  victory-native: 42.0.1
  "@babel/parser": 7.29.9
  "@babel/types": 7.29.8
  expo-image: ~58.0.16
  "@modelcontextprotocol/sdk": 1.32.2
  "@noble/hashes": 2.4.0
  "@noble/ciphers": 2.4.0
  "@noble/curves": 2.4.0
  react-native-tcp-socket: 6.4.3
  expo-crypto: ~58.0.7
  expo-secure-store: ~58.0.2

# `pnpm add` fails when a version is outside the catalog.
catalogMode: strict

minimumReleaseAgeExclude:
  # pnpm added these: @tanstack/react-query 5.104.1 is the newest stable and under one day old.
  - "@tanstack/query-core@5.104.1"
  - "@tanstack/react-query@5.104.1"
  # The persisters ship with @tanstack/react-query at the same version.
  - "@tanstack/query-persist-client-core@5.104.1"
  - marked@18.1.0
  # pnpm added these: the Expo SDK 58 packages are under the release-age gate.
  - "@expo/cli@58.1.14"
  - "@expo/config-plugins@58.0.10"
  - "@expo/config@58.0.7"
  - "@expo/env@2.5.3"
