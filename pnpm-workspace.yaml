packages:
  - apps/*
  - packages/*
  - plugins/issue-tracker
  - plugins/examples/hello
  - tooling/*
  # Playwright suite as its own package, as Turborepo's Playwright guide recommends (docs/research/playwright.md).
  - e2e
  # Shared Agent fixtures, as a package so Vitest and check-types reach them.
  - mocks
  # Repository scripts and agent hooks, as a package so turbo runs their tests.
  - tools

# Every shared dependency is pinned here; packages refer to it as "catalog:".
catalog:
  "@expo/metro-runtime": ~57.0.17
  "@jridgewell/trace-mapping": 0.3.31
  "@xterm/xterm": 6.0.0
  "@xterm/addon-fit": 0.11.0
  node-pty: 1.1.0
  "@agentclientprotocol/sdk": 1.7.0
  "@legendapp/list": 3.6.0
  # Web primitives draw on Radix directly (ADR-0020).
  "@radix-ui/react-collapsible": 1.1.20
  "@radix-ui/react-context-menu": 2.3.7
  "@radix-ui/react-dialog": 1.1.23
  "@radix-ui/react-dismissable-layer": 1.1.19
  "@radix-ui/react-dropdown-menu": 2.1.24
  "@radix-ui/react-popover": 1.1.23
  "@radix-ui/react-select": 2.3.7
  # Exact pins for the OXC toolchain and the ESLint plugins it runs as JS plugins, which are alpha; oxfmt is pre-1.0 (ADR-0017).
  "@oxlint/plugins": 1.87.0
  "@stylistic/eslint-plugin": 5.10.0
  eslint-plugin-playwright: 2.12.1
  eslint-plugin-sonarjs: 4.2.2
  eslint-plugin-unicorn: 77.0.0
  oxc-parser: 0.150.0
  oxfmt: 0.72.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2003
  "@chromatic-com/storybook": 5.4.0
  "@electron-forge/cli": 8.0.1
  "@electron-forge/plugin-fuses": 8.0.1
  "@electron-forge/plugin-vite": 8.0.1
  "@electron-forge/shared-types": 8.0.1
  "@electron/fuses": 2.1.3
  "@expo/ui": 57.0.22
  # The drawer @expo/ui's universal BottomSheet draws on the web; the web Sheet uses it directly for what that wrapper leaves out.
  vaul: 1.1.2
  # Native toasts; Expo SDK 57 lists no version for it, so this is its newest release.
  burnt: 0.13.0
  # The web toast library under Burnt's Toaster; a toast with an action (Undo) calls it directly. Burnt 0.13.0's own version.
  sonner: 2.0.8
  "@playwright/test": 1.63.0
  "@gorhom/bottom-sheet": 5.2.14
  # Portals for every platform, with named hosts.
  "@gorhom/portal": 1.0.14
  "@react-native-async-storage/async-storage": 2.2.0
  "@react-native-community/datetimepicker": 9.1.0
  "@react-native-community/slider": 5.2.0
  "expo-file-system": ~57.0.7
  "expo-haptics": ~57.0.3
  "expo-document-picker": ~57.0.3
  "expo-image-picker": ~57.0.20
  "expo-clipboard": ~57.0.2
  parse5: 8.0.1
  marked: 18.1.0
  # Code block highlighting: the core plus one grammar per language it is registered for.
  prismjs: 1.30.0
  "@types/prismjs": 1.26.5
  # Lexical packages move in lockstep; pin every one to the same version (ADR-0023).
  lexical: 0.52.0
  "@lexical/code": 0.52.0
  "@lexical/headless": 0.52.0
  "@lexical/html": 0.52.0
  "@lexical/link": 0.52.0
  "@lexical/list": 0.52.0
  "@lexical/markdown": 0.52.0
  "@lexical/react": 0.52.0
  "@lexical/rich-text": 0.52.0
  "@lexical/selection": 0.52.0
  rolldown: 1.2.12
  "tw-animate-css": 1.4.0
  "@storybook/addon-a11y": 10.6.1
  "@storybook/addon-docs": 10.6.1
  "@storybook/addon-react-native-server": 1.0.1
  "@storybook/addon-ondevice-actions": 10.6.0
  "@storybook/addon-ondevice-controls": 10.6.0
  "@storybook/addon-vitest": 10.6.1
  "@storybook/react-native": 10.6.0
  "@storybook/react-native-web-vite": 10.6.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-form": 1.33.5
  ajv: 8.20.0
  ajv-formats: 3.0.1
  "@tanstack/react-query": 5.104.1
  "@trpc/client": 11.19.0
  "@trpc/server": 11.19.0
  "@trpc/tanstack-react-query": 11.19.0
  "@types/node": 24.19.1
  "@types/react": ~19.2.2
  "@types/react-dom": 19.2.3
  "@types/ws": 8.18.2
  "@vitest/browser-playwright": 5.0.3
  "@vitest/coverage-v8": 5.0.3
  # Peers on xstate ^5.28.0.
  "@xstate/react": 6.1.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  # Exact pins: a caret range on 1.0.0-rc.4 pulls commit builds such as 1.0.0-rc.5-5935859.
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  electron: 44.5.1
  # Expo SDK 57 ranges as create-expo-app writes them, so `expo install --check` agrees.
  expo: ~57.0.31
  expo-build-properties: ~57.0.22
  expo-constants: ~57.0.22
  expo-dev-client: ~57.0.20
  expo-font: ~57.0.4
  expo-glass-effect: ~57.0.4
  expo-linking: ~57.0.13
  expo-router: ~57.0.29
  expo-screen-orientation: ~57.0.2
  expo-splash-screen: ~57.0.10
  expo-status-bar: ~57.0.1
  expo-symbols: ~57.0.3
  expo-asset: ~57.0.18
  expo-audio: ~57.0.5
  expo-video: ~57.0.5
  expo-system-ui: ~57.0.4
  jscpd: 5.4.0
  jsonc-parser: 3.3.1
  json-schema-to-typescript: 16.0.0
  knip: 6.39.0
  playwright: 1.63.0
  playwright-bdd: 9.2.1
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: ~2.32.0
  react-native-keyboard-controller: 1.21.9
  react-native-reanimated: 4.5.1
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.0
  react-native-svg: 15.15.4
  # Imports a logo SVG as a react-native-svg component in Metro (ADR-0019).
  react-native-svg-transformer: 1.5.3
  # 0.21.2, not 0.21.3: Uniwind 1.12.1 crashes on web start with 0.21.3 (uni-stack/uniwind#704, fix pending).
  react-native-web: 0.21.2
  react-native-worklets: 0.10.1
  sf-symbols-typescript: 2.2.0
  sherif: 1.13.0
  storybook: 10.6.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.7
  typescript: 7.0.2
  uniwind: 1.12.1
  vite: 8.3.2
  # The same SVG import in Storybook's Vite build, with SVGR's native output.
  vite-plugin-svgr: 5.2.0
  vitest: 5.0.3
  ws: 8.22.0
  # Exact pin: XState may change types in minor releases.
  xstate: 5.33.2
  zod: 4.6.5
  diff: 9.0.0
  expo-crypto: ~57.0.4
  fflate: 0.8.3
  tar: 7.5.22
  # Android header icons as vector drawables, the source the Stack Toolbar guide recommends.
  "@expo/material-symbols": 0.1.1
  semver: 7.8.5
  "@types/semver": 7.7.1
  esbuild: 0.28.2
  "@types/react-reconciler": 0.33.0
  react-reconciler: 0.33.0
  "@shopify/react-native-skia": 2.14.0
  "@babel/parser": 7.29.9
  "@babel/types": 7.29.8
  expo-image: ~57.0.5

# `pnpm add` fails when a version is outside the catalog.
catalogMode: strict

minimumReleaseAgeExclude:
  # pnpm added these: @tanstack/react-query 5.104.1 is the newest stable and under one day old.
  - "@tanstack/query-core@5.104.1"
  - "@tanstack/react-query@5.104.1"
  # The persisters ship with @tanstack/react-query at the same version.
  - "@tanstack/query-persist-client-core@5.104.1"
  - marked@18.1.0
  - expo-crypto@57.0.4
  - "@expo/cli@57.0.32"
  - "@expo/config-plugins@57.0.11"
  - "@expo/router-server@57.0.14"
  - "@expo/ui@57.0.26"
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - expo-router@57.0.29
  - expo@57.0.31

# drizzle-kit pulls esbuild; `drizzle-kit generate` works without its install script.
allowBuilds:
  node-pty: true
  esbuild: false
  "@shopify/react-native-skia@2.14.0": true

# pnpm's default, written out: Electron Forge refuses to start unless node-linker is hoisted or a hoist pattern is set.
hoistPattern:
  - "*"

patchedDependencies:
  "@expo/ui@57.0.22": patches/@expo__ui@57.0.22.patch
  expo-symbols@57.0.3: patches/expo-symbols@57.0.3.patch
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
  react-native@0.86.3: patches/react-native@0.86.3.patch
  xstate@5.33.2: patches/xstate@5.33.2.patch
