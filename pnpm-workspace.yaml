packages:
  - apps/*
  - packages/*
  - tooling/*

# Every shared dependency is pinned here; packages refer to it as "catalog:" (spec section 2).
catalog:
  "@biomejs/biome": 2.5.15
  "@trpc/server": 11.19.0
  "@types/node": 24.19.1
  "@types/react": ~19.2.2
  "@types/ws": 8.18.2
  # Exact pins: a caret range on 1.0.0-rc.4 pulls commit builds such as 1.0.0-rc.5-5935859 (docs/research/drizzle.md).
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  # Expo SDK 57 ranges as create-expo-app writes them, so `expo install --check` agrees.
  expo: ~57.0.26
  expo-constants: ~57.0.20
  expo-dev-client: ~57.0.19
  expo-font: ~57.0.4
  expo-linking: ~57.0.11
  expo-router: ~57.0.24
  expo-splash-screen: ~57.0.9
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.4
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: ~2.32.0
  react-native-reanimated: 4.5.1
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.0
  react-native-web: ~0.21.0
  react-native-worklets: 0.10.1
  sherif: 1.13.0
  tsx: 4.23.15
  turbo: 2.11.7
  typescript: 7.0.2
  vite: 8.3.2
  vitest: 5.0.3
  ws: 8.22.0
  # Exact pin: XState may change types in minor releases (docs/research/xstate.md).
  xstate: 5.33.2
  zod: 4.6.5

# `pnpm add` fails when a version is outside the catalog.
catalogMode: strict

# turbo 2.11.7 is younger than the default one-day minimumReleaseAge; the spec asks for the newest stable.
minimumReleaseAgeExclude:
  - turbo
  - "@turbo/*"

# drizzle-kit pulls esbuild; `drizzle-kit generate` works without its install script (docs/research/drizzle.md).
allowBuilds:
  esbuild: false
