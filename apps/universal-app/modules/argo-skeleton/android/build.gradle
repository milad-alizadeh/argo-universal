apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.argoskeleton'
version = '1.0.0'

android {
  namespace "expo.modules.argoskeleton"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // The semantics tree of Compose content (the Skeleton reads text lines and control bounds from it); the
  // same version Expo UI draws with.
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.core:core-ktx:1.18.0'
}
