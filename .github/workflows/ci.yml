# Quality, Engine tests, story tests, the story render gates and web e2e on every push, and on a pull request when its changes need them; the Electron smoke e2e on main and release/*.
# The jobs run in parallel and the Engine tests, story tests and web e2e are split into shards, so a run takes as long as its slowest job.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Pushes to release branches run CI so the Electron job below can run there.
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Skips the jobs a pull request's changes cannot affect; pushes run them all.
  changes:
    name: Choose the jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.choose.outputs.quality }}
      engine-tests: ${{ steps.choose.outputs.engine-tests }}
      stories: ${{ steps.choose.outputs.stories }}
      e2e-web: ${{ steps.choose.outputs.e2e-web }}
    steps:
      # The choice compares with the pull request's base commit; blob:none fetches the history without file contents.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # The catalog's turbo alone, so the choice runs before any pnpm install; an unreadable pin fails here instead of installing the latest.
      - name: Install turbo
        run: |
          version=$(sed -nE 's/^  turbo: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pnpm-workspace.yaml)
          test -n "$version"
          npm install --global "turbo@$version"

      - name: Choose the jobs
        id: choose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          quality=true
          engine=true
          stories=true
          e2e=true
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only "$BASE...HEAD")
            # turbo exits 0 when nothing is affected, 1 when something is and 2 on an error; an error counts as affected.
            affected() { ! turbo query affected --base "$BASE" --head HEAD "$@" --exit-code > /dev/null; }

            # Quality's tools never read Markdown, but a check can: mocks/agent/release-notes.md is an e2e fixture.
            quality=false
            if grep -qv '\.md$' <<< "$files" || affected --tasks check-types test; then quality=true; fi

            # Turbo cannot see root files, .github/ or patches/. turbo.json gives every package a no-op test:web, so only @repo/e2e's counts.
            outside=$(grep -E '^(\.github/|patches/|[^/]+$)' <<< "$files" | grep -v '\.md$' || true)
            engine=false
            if [ -n "$outside" ] || affected --tasks test --packages @repo/engine; then engine=true; fi
            stories=false
            if [ -n "$outside" ] || affected --tasks test:stories; then stories=true; fi
            e2e=false
            if [ -n "$outside" ] || affected --tasks test:web --packages @repo/e2e; then e2e=true; fi
          fi

          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "engine-tests=$engine" >> "$GITHUB_OUTPUT"
          echo "stories=$stories" >> "$GITHUB_OUTPUT"
          echo "e2e-web=$e2e" >> "$GITHUB_OUTPUT"
          echo "Quality runs: $quality. Engine tests run: $engine. Story tests run: $stories. Web e2e runs: $e2e."

  quality:
    name: Quality
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Vercel Remote Cache step trades GitHub's OIDC token for a short-lived Turborepo token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main for the waiver merge base
        run: git fetch origin main:refs/remotes/origin/main

      # The desktop CSP test checks the policy in real Chromium; the story tests run in the stories job.
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Lint
        run: pnpm quality:lint

      - name: Build Plugin reference docs
        run: pnpm docs:build

      - name: Check generated Plugin artifacts
        run: |
          pnpm --filter @repo/contracts check:plugin-reference
          pnpm check:plugin-generation
          git diff --exit-code

      - name: Type checks
        run: pnpm exec turbo run check-types --continue=dependencies-successful

      # The Engine's tests run in their own sharded job below.
      - name: Tests
        env:
          # Each test runner uses the available cores; overlapping runners distort timing budgets.
          TURBO_CONCURRENCY: 1
          VITEST_MAX_WORKERS: 1
        run: pnpm exec turbo run test --filter='!@repo/engine' --continue=dependencies-successful

  # The Engine's suite alone takes minutes with one worker, so it runs beside Quality in shards.
  engine-tests:
    name: Engine tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.engine-tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none
          turbo-team: ${{ vars.TURBO_TEAM }}

      # One worker keeps the Feed workload's event-loop budget honest; a shard's --shard argument feeds its hash.
      - name: Engine tests
        env:
          VITEST_MAX_WORKERS: 1
        run: pnpm exec turbo run test --filter=@repo/engine -- --shard=${{ matrix.shard }}/3

  # The story tests alone take minutes, so they run beside Quality in shards; each shard's one runner keeps the config's maxWorkers.
  stories:
    name: Story tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.stories == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Story tests
        run: pnpm exec turbo run test:stories -- --shard=${{ matrix.shard }}/3

      # apps/storybook/vitest.setup.ts saves a failed story's screenshot in __screenshots__/failures beside its test file.
      - name: Upload the story failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: story-failure-screenshots-${{ matrix.shard }}
          path: "**/__screenshots__/"
          if-no-files-found: ignore
          retention-days: 30

  # The render gates draw every story and compare the drawings, so they need the whole set in one run and cannot shard.
  story-renders:
    name: Story render gates
    needs: changes
    if: ${{ needs.changes.outputs.stories == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Story render gates
        run: pnpm check:story-renders

  e2e-web:
    name: End-to-end tests (web ${{ matrix.shard }}/6)
    needs: changes
    if: ${{ needs.changes.outputs.e2e-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Each test starts its own Server and Engine beside Chromium, so shards rather than workers add parallelism.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Builds or restores the Expo web export through turbo, then replays from cache when nothing @repo/e2e depends on changed.
      - name: End-to-end tests (web)
        run: pnpm test:e2e --log-order=stream
        env:
          ARGO_E2E_SHARD: ${{ matrix.shard }}/6

      # The blob report carries each failure's trace into the merged HTML report.
      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 1

  e2e-web-report:
    name: Merge the web e2e report
    if: ${{ !cancelled() && needs.e2e-web.result != 'skipped' }}
    needs: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports into one HTML report
        working-directory: e2e
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the web e2e report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-web
          path: e2e/playwright-report/
          retention-days: 30

  e2e-electron:
    name: End-to-end tests (Electron)
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The shared App fixture also initializes a Playwright browser context for Electron.
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Electron 44 downloads its binary on first use; fetch it before the tests start their timers.
      - name: Install Electron
        run: pnpm --filter @repo/desktop exec install-electron

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox uses (electron/electron#42510).
      - name: Allow user namespaces for Electron
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Bare Xvfb has no window manager, so a window never minimizes; Openbox gives the notification scenarios a real minimized state.
      - name: Install a window manager
        run: sudo apt-get install -y --no-install-recommends openbox

      - name: End-to-end tests (Electron)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- sh -c 'openbox & pnpm test:e2e:electron'

      - name: Upload the Electron e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-electron
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30

  # Branch protection requires this one check, so splitting or renaming the jobs above never changes the required checks.
  # A skipped job passes it; a failed choice fails it.
  ci:
    name: Quality and end-to-end tests
    if: ${{ always() }}
    needs:
      [
        changes,
        quality,
        engine-tests,
        stories,
        story-renders,
        e2e-web,
        e2e-electron,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
