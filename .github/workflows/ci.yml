# Quality, Engine tests, the macOS secret store contract, story tests, the story render gates and web e2e on a push or pull request when its changes need them, and every job nightly; the Electron smoke e2e on main, release/* and nightly.
# The jobs run in parallel and the Engine tests, the other packages' tests, story tests, render gates and web e2e are split into shards, so a run takes as long as its slowest job.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
      # Pushes to release branches run CI so the Electron job below can run there.
      - "release/**"
  # A nightly full run on main catches what a narrowed push or pull request run skipped.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  # A merged PR's ref becomes main; its number keeps the closing event in the PR's group.
  # The nightly run has its own group, so a push to main never cancels it nor it a push.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Skips the jobs a change cannot affect: a pull request's since its base, a push's since the commit before it. The nightly run, a new branch and a force push run them all.
  changes:
    name: Choose the jobs
    # Closing a PR cancels its old run without starting another set of jobs.
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.choose.outputs.quality }}
      engine-tests: ${{ steps.choose.outputs.engine-tests }}
      secret-store: ${{ steps.choose.outputs.secret-store }}
      plugin-generation: ${{ steps.choose.outputs.plugin-generation }}
      stories: ${{ steps.choose.outputs.stories }}
      e2e-web: ${{ steps.choose.outputs.e2e-web }}
    steps:
      # The choice compares with the pull request's base commit or the push's previous one; blob:none fetches the history without file contents.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # The catalog's turbo alone, so the choice runs before any pnpm install; an unreadable pin fails here instead of installing the latest.
      - name: Install turbo
        run: |
          version=$(sed -nE 's/^  turbo: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pnpm-workspace.yaml)
          test -n "$version"
          npm install --global "turbo@$version"

      - name: Choose the jobs
        id: choose
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          quality=true
          engine=true
          secrets=true
          generation=true
          stories=true
          e2e=true
          # A new branch's push has an all-zero `before`, and a force push's may be gone from history.
          if [ -n "$BASE" ] && { [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; }; then BASE=; fi
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only "$BASE...HEAD")
            # turbo exits 0 when nothing is affected, 1 when something is and 2 on an error; an error counts as affected.
            affected() { ! turbo query affected --base "$BASE" --head HEAD "$@" --exit-code > /dev/null; }

            # Quality's tools never read Markdown, but a check can: mocks/agent/release-notes.md is an e2e fixture.
            quality=false
            if grep -qv '\.md$' <<< "$files" || affected --tasks check-types test; then quality=true; fi

            # Turbo cannot see root files, .github/ or patches/. turbo.json gives every package a no-op test:web, so only @repo/e2e's counts.
            # The lint, format, duplication, dead-code and skills configs and .gitignore are read only by Quality.
            qualityOnly='^(\.oxlintrc\.json|\.oxfmtrc\.json|\.jscpd[^/]*\.json|knip\.jsonc|skills-lock\.json|\.gitignore)$'
            outside=$(grep -E '^(\.github/|patches/|[^/]+$)' <<< "$files" | grep -v '\.md$' | grep -Ev "$qualityOnly" || true)
            engine=false
            if [ -n "$outside" ] || affected --tasks test --packages @repo/engine; then engine=true; fi
            # The Keychain contract reads only the keyring adapter and the keyring package the lockfile pins.
            secrets=false
            if grep -qE '^(packages/engine/src/plugins/services/secret-store[^/]*\.ts|pnpm-lock\.yaml|\.github/workflows/ci\.yml)$' <<< "$files"; then secrets=true; fi
            # The Plugin generation check proves turbo.json's wiring of the generator and the Plugin type checks.
            generation=false
            if grep -qE '^(turbo\.json|packages/contracts/tools/generate-plugin-kit\.mts|tools/(plugin-typecheck|check-plugin-generation)\.mts)$' <<< "$files"; then generation=true; fi
            stories=false
            if [ -n "$outside" ] || affected --tasks test:stories; then stories=true; fi
            e2e=false
            if [ -n "$outside" ] || affected --tasks test:web --packages @repo/e2e; then e2e=true; fi
          fi

          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "engine-tests=$engine" >> "$GITHUB_OUTPUT"
          echo "secret-store=$secrets" >> "$GITHUB_OUTPUT"
          echo "plugin-generation=$generation" >> "$GITHUB_OUTPUT"
          echo "stories=$stories" >> "$GITHUB_OUTPUT"
          echo "e2e-web=$e2e" >> "$GITHUB_OUTPUT"
          echo "Quality runs: $quality. Engine tests run: $engine. The secret store contract runs: $secrets. Story tests run: $stories. Web e2e runs: $e2e."

  # Each gate is its own step and runs even when one before it failed, so one run reports every failing gate.
  # The gates are `pnpm quality:lint`'s, less sherif, which the install's postinstall already ran, and check-canvaskit, which cannot fail after the install copied CanvasKit.
  quality:
    name: Quality
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The Vercel Remote Cache step trades GitHub's OIDC token for a short-lived Turborepo token.
      id-token: write
    steps:
      # Full history brings every branch, so the rule allowlists find their merge base with origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup
        with:
          playwright: none
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Operation mutations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-operation-mutations.mts

      - name: Generated Operations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --import tsx tools/generate-operations.mts --check

      - name: Generated registry validators
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --import tsx packages/contracts/tools/registry/generate-validators.mts --check

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec oxfmt --check

      - name: Lint and rule allowlists
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-rule-allowlists.mts

      - name: Comments
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-comments.mts

      - name: Test suffixes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-test-suffix.mts

      - name: Test-only imports
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-test-only-imports.mts

      - name: Story titles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-story-titles.mts

      - name: Story gates
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --import tsx tools/check-story-gates.mts

      - name: Kit pairing
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --import tsx tools/check-kit-pairing.mts

      - name: Duplication
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm quality:duplication

      - name: Dead code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm quality:dead-code

      - name: Plugin reference docs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm docs:build
          pnpm --filter @repo/contracts check:plugin-reference

      - name: Plugin generation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.plugin-generation == 'true' }}
        run: pnpm check:plugin-generation

      # Status, not diff, so a generated file that should exist but is not committed fails too.
      - name: Generated files are committed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          changed=$(git status --porcelain)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff
            exit 1
          fi

  # Type checks take minutes and memory of their own, so they run beside Quality.
  types:
    name: Type checks
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Type checks
        env:
          # A Contracts edit leaves every package uncached, and a type check takes up to 3 GB: Turborepo's ten at once ran the runner out of memory (#2340).
          TURBO_CONCURRENCY: 4
        run: pnpm exec turbo run check-types --continue=dependencies-successful

  # Every package's tests but the Engine's, in three groups of about seven minutes each; run serially in one job they took twenty.
  # `rest` is everything the other groups and the Engine job leave, so a new package's tests run without an edit here.
  unit-tests:
    name: Unit tests (${{ matrix.group }})
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: plugins
            filter: --filter=./plugins/*
            playwright: none
          - group: kits
            filter: --filter=@argo/plugin-kit --filter=@repo/client
            playwright: none
          # The desktop CSP test checks the policy in real Chromium, which the step below installs only when that test runs.
          - group: rest
            filter: --filter=!@repo/engine --filter=!./plugins/* --filter=!@argo/plugin-kit --filter=!@repo/client
            playwright: none
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          playwright: ${{ matrix.playwright }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Install Chromium when the desktop CSP test runs
        if: ${{ matrix.group == 'rest' }}
        run: |
          status=$(pnpm exec turbo run test --filter=@repo/desktop --dry=json | node -e "let d='';process.stdin.on('data',(c)=>{d+=c}).on('end',()=>{console.log(JSON.parse(d).tasks.find((t)=>t.taskId==='@repo/desktop#test')?.cache.status??'MISS')})")
          if [ "$status" != HIT ]; then pnpm --filter @repo/e2e exec playwright install --with-deps --only-shell chromium; fi

      - name: Tests
        env:
          # Each package's runner uses every core and runs its `budget` project alone after the rest; one package at a time keeps another's tests off those cores.
          TURBO_CONCURRENCY: 1
        # set -f keeps the shell from expanding the ./plugins/* filter against the checkout.
        run: |
          set -f
          pnpm exec turbo run test ${{ matrix.filter }} --continue=dependencies-successful

  # The Engine's suite takes minutes, so it runs beside Quality in shards.
  engine-tests:
    name: Engine tests (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.engine-tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none
          turbo-team: ${{ vars.TURBO_TEAM }}

      # The Feed workload's event-loop budget runs in the serial `budget` project after the rest; a shard's --shard argument feeds its hash.
      - name: Engine tests
        run: pnpm exec turbo run test --filter=@repo/engine -- --shard=${{ matrix.shard }}/2

  # The keyring adapter's contract test reads and writes the real OS secret store, and only a macOS runner has the Keychain (ADR-0051).
  secret-store:
    name: Secret store contract (macOS)
    needs: changes
    if: ${{ needs.changes.outputs.secret-store == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none

      # A runner's login keychain can be locked; a throwaway unlocked default keychain, first in the search list, lets the test write without a prompt. Its password is a throwaway, not a Secret.
      - name: Make an unlocked default keychain
        run: |
          security create-keychain -p ci argo-ci.keychain
          security list-keychains -d user -s argo-ci.keychain login.keychain
          security default-keychain -s argo-ci.keychain
          security unlock-keychain -p ci argo-ci.keychain
          security set-keychain-settings argo-ci.keychain

      - name: Secret store contract test
        run: pnpm --filter @repo/engine exec vitest run src/plugins/services/secret-store.integration.test.ts

  # The story tests alone take minutes, so they run beside Quality in shards; each shard's one runner keeps the config's maxWorkers.
  stories:
    name: Story tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.stories == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Story tests
        run: pnpm exec turbo run test:stories -- --shard=${{ matrix.shard }}/3

      - name: Report browser failure diagnostics
        if: ${{ failure() }}
        run: |
          free -m
          df -h /dev/shm
          sudo dmesg --ctime | tail -80

      # apps/storybook/vitest.setup.ts saves a failed story's screenshot in __screenshots__/failures beside its test file.
      - name: Upload the story failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: story-failure-screenshots-${{ matrix.shard }}
          path: "**/__screenshots__/"
          if-no-files-found: ignore
          retention-days: 30

  # The render gates judge each file against itself, so a runner takes a share of the files and judges its own drawings.
  # A pull request draws the story files its change reaches; a push draws every story.
  story-renders:
    name: Story render gates (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ needs.changes.outputs.stories == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The pull request's base commit must be present to list what the change reaches; blob:none fetches the history without file contents.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Story render gates
        run: pnpm check:story-renders --shard=${{ matrix.shard }}/4 ${{ github.event_name == 'pull_request' && format('--changed={0}', github.event.pull_request.base.sha) || '' }}

  # Builds what the web e2e shards run against once, into the Remote Cache, so six shards do not each build the Expo web export.
  e2e-web-build:
    name: Build for web e2e
    needs: changes
    if: ${{ needs.changes.outputs.e2e-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build @repo/e2e's dependencies
        run: pnpm exec turbo run build --filter=@repo/e2e^...

  e2e-web:
    name: End-to-end tests (web ${{ matrix.shard }}/6)
    needs: [changes, e2e-web-build]
    if: ${{ needs.changes.outputs.e2e-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Each test starts its own Server and Engine beside Chromium, so shards rather than workers add parallelism.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Restores the Expo web export the build job cached, then replays from cache when nothing @repo/e2e depends on changed.
      - name: End-to-end tests (web)
        run: pnpm test:e2e --log-order=stream
        env:
          ARGO_E2E_SHARD: ${{ matrix.shard }}/6

      # The blob report carries each failure's trace into the merged HTML report.
      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 1

  # Only a failing run needs the report: it carries each failure's trace.
  e2e-web-report:
    name: Merge the web e2e report
    if: ${{ !cancelled() && needs.e2e-web.result == 'failure' }}
    needs: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports into one HTML report
        working-directory: e2e
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the web e2e report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-web
          path: e2e/playwright-report/
          retention-days: 30

  e2e-electron:
    name: End-to-end tests (Electron)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The shared App fixture also initializes a Playwright browser context for Electron.
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Electron 44 downloads its binary on first use; fetch it before the tests start their timers.
      - name: Install Electron
        run: pnpm --filter @repo/desktop exec install-electron

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox uses (electron/electron#42510).
      - name: Allow user namespaces for Electron
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Bare Xvfb has no window manager, so a window never minimizes; Openbox gives the notification scenarios a real minimized state.
      - name: Install a window manager
        run: sudo apt-get install -y --no-install-recommends openbox

      - name: End-to-end tests (Electron)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- sh -c 'openbox & pnpm test:e2e:electron'

      - name: Upload the Electron e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-electron
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30

  # Branch protection requires this one check, so splitting or renaming the jobs above never changes the required checks.
  # A skipped job passes it; a failed choice fails it.
  ci:
    name: Quality and end-to-end tests
    if: ${{ always() && github.event.action != 'closed' }}
    needs:
      [
        changes,
        quality,
        types,
        unit-tests,
        engine-tests,
        secret-store,
        stories,
        story-renders,
        e2e-web-build,
        e2e-web,
        e2e-electron,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
