# Quality and web e2e on every pull request and push to main; Electron e2e on main and release/*.
# The jobs run in parallel and the web e2e suite is split into shards, so a run takes as long as its slowest job.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Pushes to release branches run CI so the Electron job below can run there.
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Vercel Remote Cache step trades GitHub's OIDC token for a short-lived Turborepo token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main for the waiver merge base
        run: git fetch origin main:refs/remotes/origin/main

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Quality
        run: pnpm quality
        env:
          # Each test runner uses the available cores; overlapping runners distort timing budgets.
          TURBO_CONCURRENCY: 1

      # apps/storybook/vitest.setup.ts saves a failed story's screenshot in __screenshots__/failures beside its test file.
      - name: Upload the story failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: story-failure-screenshots
          path: "**/__screenshots__/"
          if-no-files-found: ignore
          retention-days: 30

  e2e-web:
    name: End-to-end tests (web ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Builds or restores the Expo web export through turbo, then replays from cache when nothing @repo/e2e depends on changed.
      - name: End-to-end tests (web)
        run: pnpm test:e2e
        env:
          ARGO_E2E_SHARD: ${{ matrix.shard }}/3

      # The blob report carries each failure's trace into the merged HTML report.
      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 1

  e2e-web-report:
    name: Merge the web e2e report
    if: ${{ !cancelled() }}
    needs: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: none

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports into one HTML report
        working-directory: e2e
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the web e2e report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-web
          path: e2e/playwright-report/
          retention-days: 30

  e2e-electron:
    name: End-to-end tests (Electron)
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The shared App fixture also initializes a Playwright browser context for Electron.
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Electron 44 downloads its binary on first use; fetch it before the tests start their timers.
      - name: Install Electron
        run: pnpm --filter @repo/desktop exec install-electron

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox uses (electron/electron#42510).
      - name: Allow user namespaces for Electron
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (Electron)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm test:e2e:electron

      - name: Upload the Electron e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-electron
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30

  # Branch protection requires this one check, so splitting or renaming the jobs above never changes the required checks.
  ci:
    name: Quality and end-to-end tests
    if: ${{ always() }}
    needs: [quality, e2e-web, e2e-electron]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
