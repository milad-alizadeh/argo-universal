appId: dev.argo.app
name: A tap on the fixture page reaches the Plugin and redraws the page
---
# Start on the phone Sessions list, connected to a Server that loads the
# first-party `counter` fixture Plugin.
# The drawer button is "Open navigation" on iOS and Material's own label on Android.
- tapOn: "^(Open navigation|Show navigation menu)$"
- tapOn: "^Counter$"
# The page is drawn natively from the Plugin's wire tree.
- assertVisible: "^Counter fixture$"
# The count is the page's Page state, which the App keeps; read it rather than assume it starts at 0.
- copyTextFrom: "^Tapped \\d+ times$"
- evalScript: ${output.expectedCount = 'Tapped ' + (parseInt(maestro.copiedText.split(' ')[1]) + 1) + ' times'}
# "Tap me" carries a Page state change; the App asks the Server to draw the
# new address and shows the tree it sends back.
- tapOn: "^Tap me$"
- assertVisible: ${output.expectedCount}
