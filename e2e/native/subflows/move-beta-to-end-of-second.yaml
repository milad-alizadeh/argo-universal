appId: dev.argo.app
name: Hold Beta, open Move to…, and pick the end of Second
---
- longPressOn: "^Beta$"
- tapOn: "^Move to…$"
# The picker is a fitted List in a phone sheet, which once drew its title and no rows.
- assertVisible: "^Move to$"
- tapOn:
    text: "^End$"
    below: "^Second$"
# Beta now ends the Second Section, under Delta.
- assertVisible:
    text: "^Beta$"
    below: "^Delta$"
