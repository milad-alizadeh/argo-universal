appId: dev.argo.app
name: A native grouped List's FieldGroup rows move from their long-press menu
---
- openLink: "argo://storybook?STORYBOOK_STORY_ID=design-system-primitives-lists-list-moves--grouped"
- longPressOn: "^Beta$"
- tapOn: "^Move down$"
- assertVisible:
    text: "^Beta$"
    below: "^Gamma$"
- longPressOn: "^Beta$"
- tapOn: "^Move to…$"
- assertVisible: "^Move to$"
- tapOn:
    text: "^End$"
    below: "^Second$"
# Beta now ends the Second Section, under Delta.
- assertVisible:
    text: "^Beta$"
    below: "^Delta$"
