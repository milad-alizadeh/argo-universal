appId: dev.argo.app
name: The Attach menu's Slash Commands puts a slash in the Composer and opens the list
---
# Opens Composer → Composer → Suggestions, whose draft is "/" and whose Agent offers inspect and review.
- openLink: "argo://storybook?STORYBOOK_STORY_ID=composer-composer--suggestions"
# Empty the draft (a fresh story holds "/"): the list closes with the slash.
- tapOn:
    text: "^/$"
    optional: true
- eraseText: 5
- assertNotVisible: "^inspect$"
- hideKeyboard
- tapOn: "^Attach$"
- tapOn: "Slash Commands"
# The Composer's field now holds the slash and the list is open again.
- assertVisible: "^/$"
- assertVisible: "^inspect$"
- assertVisible: "^review$"
