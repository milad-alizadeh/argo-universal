appId: dev.argo.app
name: Configure controls own Android accessibility
---
# Start in the native ComposerConfiguration "Fast mode on" Storybook preview,
# with Configure open. Use the real FieldGroup rows, Toggle and Slider.
- assertVisible:
    containsChild:
      text: "^Fast mode$"
    checked: true
    enabled: true
- assertNotVisible:
    text: "^Fast mode$"
    index: 1
- assertVisible:
    text: "^Effort, Medium$"
# Not asserted: a lone "Effort", a lone "Medium" and a second "Effort, Medium". The slider row's headline and value
# stay separate nodes beside the merged one, and Expo UI's semantics modifier offers only contentDescription, so
# no prop merges or hides them.
- tapOn: "^Fast mode$"
- assertVisible:
    text: "^Fast mode$"
- assertNotVisible:
    containsChild:
      text: "^Fast mode$"
    checked: true
- tapOn: "^Fast mode$"
- assertVisible:
    containsChild:
      text: "^Fast mode$"
    checked: true
