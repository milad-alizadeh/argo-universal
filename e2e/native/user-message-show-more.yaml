appId: dev.argo.app
name: A collapsed user message keeps Show more pressable
---
# Start in the native Feed → UserMessage Storybook preview. Its "Markdown"
# prompt runs past four lines, so it clamps behind Show more.
- assertVisible:
    text: "^Show more$"
    below: "^Markdown$"
    above: "^Long text$"
# The tap lands on Show more only when no clipped markdown covers it.
- tapOn:
    text: "^Show more$"
    below: "^Markdown$"
    above: "^Long text$"
# Expanded, the prompt drops its Show more.
- assertNotVisible:
    text: "^Show more$"
    below: "^Markdown$"
    above: "^Long text$"
